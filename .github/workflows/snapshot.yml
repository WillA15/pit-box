# Keeps the bundled fallback data (public/data) current. Every few hours it checks Jolpica for
# new race or sprint results; when there are some it rebuilds the snapshot and pushes it to main,
# which makes Vercel redeploy. Runs with nothing new change no files and make no commit.
name: Refresh data snapshot

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours (UTC)
  workflow_dispatch: {} # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild snapshot if there are new results
        run: npm run snapshot -- if-new
      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- public/data; then
            echo "Snapshot unchanged."
            exit 0
          fi
          round=$(node -p "require('./public/data/season.json').standingsRound")
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh data snapshot through round ${round}"
          git push
